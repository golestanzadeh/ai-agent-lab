name: Agent Bridge Passive Validation

on:
  push:
    branches:
      - d021-agent-case-provisioning
    paths:
      - scripts/agent_bridge_validate.py
      - tests/unit/test_agent_bridge_validate.py
      - requirements.txt
      - .github/workflows/agent-bridge-passive.yml
      - .github/agent-bridge-step10-trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-bridge-passive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRIDGE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify fail-closed kill switch
        run: |
          set -euo pipefail
          test "$BRIDGE_ENABLED" = "false"
      - name: Install project and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run Agent Bridge validator tests
        run: python -m pytest -q tests/unit/test_agent_bridge_validate.py
      - name: Run full regression suite
        run: python -m pytest -q

# Observe-only final verification: no secrets, no Codex, no comments, no repository writes,
# no continuation and no runtime tax action. BRIDGE_ENABLED=false is the fail-closed rollback state.
