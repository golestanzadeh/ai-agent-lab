name: Agent Bridge Passive Validation

on:
  push:
    branches:
      - d021-agent-case-provisioning
    paths:
      - scripts/agent_bridge_validate.py
      - tests/unit/test_agent_bridge_validate.py
      - .github/workflows/agent-bridge-passive.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-bridge-passive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install bounded test dependency
        run: python -m pip install pytest
      - name: Run passive validator tests
        run: python -m pytest -q tests/unit/test_agent_bridge_validate.py

# Observe-only by design: no secrets, no Codex, no comments, no repository writes,
# no continuation, no runtime tax action.
