name: D-017 verification

on:
  push:
    branches: [main]

jobs:
  d017-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: PYTHONPATH=src python -m pytest -q tests/unit/test_approval.py
